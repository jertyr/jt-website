<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Notebook</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel-2: #1f232c; --line: #2b313c;
    --text: #e7eaf0; --muted: #93a0b4; --accent: #4f9dff;
    --red: #ff5c5c; --amber: #ffb74d; --green: #4caf78;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.45;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
  a { color: var(--accent); }

  /* ---- Auth gate ---- */
  #gate { position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  #gate .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px; width: 360px; max-width: 92vw; }
  #gate h1 { font-size: 18px; margin: 0 0 4px; }
  #gate p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  #gate input { width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 14px; }
  .msg { font-size: 12.5px; min-height: 16px; margin-top: 4px; }
  .msg.err { color: var(--red); } .msg.ok { color: var(--green); } .msg.muted { color: var(--muted); }

  button { cursor: pointer; border: none; border-radius: 8px; font-size: 14px;
    padding: 9px 14px; background: var(--accent); color: #fff; font-weight: 600; }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button.ghost { background: transparent; color: var(--muted); padding: 4px 8px; font-weight: 500; }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }

  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin-bottom: 14px; }
  header.top h1 { font-size: 22px; margin: 0; }
  .who { color: var(--muted); font-size: 12.5px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .tabs button { background: transparent; color: var(--muted); border: none; border-bottom: 2px solid transparent;
    border-radius: 0; padding: 8px 12px; font-weight: 600; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

  .card2 { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; }
  .card2 h3 { margin: 0 0 4px; font-size: 15px; }
  .card2 .sub { color: var(--muted); font-size: 12.5px; }
  .clickable { cursor: pointer; } .clickable:hover { border-color: var(--accent); }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }
  input[type=text], input[type=date], select, textarea {
    padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 14px; font-family: inherit; }
  textarea { width: 100%; min-height: 70px; resize: vertical; }
  label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; }

  .note { border-left: 2px solid var(--line); padding: 6px 0 6px 12px; margin: 8px 0; }
  .note .head { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; }
  .badge { padding: 1px 7px; border-radius: 20px; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--muted); font-size: 11px; }
  .badge.type-1\3a 1 { color: var(--accent); }
  .badge.type-goal { color: var(--green); }
  .badge.type-expectation { color: var(--amber); }
  .badge.type-observation { color: #cdd6e4; }

  .back { font-size: 13px; margin-bottom: 12px; display: inline-block; }
  .add-box { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px;
    padding: 12px 14px; margin: 14px 0; }
  .add-grid { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: end; }
  .add-grid .full { grid-column: 1 / -1; }
  @media (max-width: 600px){ .add-grid { grid-template-columns: 1fr; } }
  /* ---- Recipes ---- */
  .search { width: 100%; margin-bottom: 12px; }
  .ing { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0;
    border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .ing:last-child { border-bottom: none; }
  .ing .qty { color: var(--muted); white-space: nowrap; text-align: right; }
  /* Guessed from the instructions rather than taken from the source — flagged
     until reviewed, then flip recipe_ingredients.inferred to false. */
  .ing .flag { font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--amber); border: 1px solid var(--amber); border-radius: 20px;
    padding: 0 5px; margin-left: 7px; vertical-align: 1px; }
  .step { display: flex; gap: 10px; margin: 10px 0; font-size: 13.5px; }
  /* ---- Tasks ---- */
  .task-title, .edit-head { font-size: 15px; cursor: pointer; display: inline-block;
    border-bottom: 1px dashed transparent; }
  .task-title:hover, .edit-head:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .note .head button { padding: 0 4px; font-size: 11.5px; }
  .task-preview { color: var(--muted); font-size: 12.5px; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .edit-grid .full { grid-column: 1 / -1; }
  .edit-grid input, .edit-grid textarea { width: 100%; }
  @media (max-width: 600px){ .edit-grid { grid-template-columns: 1fr; } }

  .step .n { flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--accent);
    font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

  .empty { color: var(--muted); font-size: 14px; padding: 20px 0; }
  .setup { background: var(--panel); border: 1px solid var(--amber); border-radius: 10px; padding: 16px;
    color: var(--text); font-size: 13.5px; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<!-- ===== Auth gate (real: Supabase magic link) ===== -->
<div id="gate">
  <div class="card">
    <h1>📓 Notebook</h1>
    <p>Sign in with your email — you'll get a one-time magic link.</p>
    <div id="gateBody">
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
      <button id="loginBtn" style="width:100%">Send magic link</button>
      <div class="msg muted" id="gateMsg"></div>
    </div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header class="top">
    <h1>📓 Notebook</h1>
    <div class="who"><span id="whoEmail"></span> · <button class="ghost" id="logoutBtn">Sign out</button></div>
  </header>

  <div class="tabs">
    <button data-tab="tasks" class="active">Tasks</button>
    <button data-tab="people">People</button>
    <button data-tab="projects">Projects</button>
    <button data-tab="meetings">Meetings</button>
    <button data-tab="calendar">Calendar</button>
    <button data-tab="recipes">Recipes</button>
  </div>

  <div id="view"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* =========================================================================
   CONFIG — fill these in after creating your Supabase project.
   See SETUP-notebook.md. Until both are set, the page shows setup instructions.
   The anon key is SAFE to publish: Row-Level Security blocks anonymous access,
   so nothing is readable without signing in. The service_role key must NEVER
   go here — it lives only in the Claude MCP connector.
   ========================================================================= */
const SUPABASE_URL  = "https://zyqawhqazuvgavqnngmn.supabase.co";
const SUPABASE_ANON = "sb_publishable_X5ORIPYRjJ2rql8cejljeA_Loipyqq7";

const gate = document.getElementById("gate");
const app  = document.getElementById("app");
let sb = null, currentTab = "tasks";

/* ---------- Boot ---------- */
if (!SUPABASE_URL || !SUPABASE_ANON) {
  showSetupNeeded();
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  boot();
}

function showSetupNeeded() {
  document.getElementById("gateBody").innerHTML =
    '<div class="setup">This page isn\'t connected yet. Add your Supabase '
    + '<code>SUPABASE_URL</code> and <code>SUPABASE_ANON</code> near the top of '
    + 'this file\'s script (see <code>SETUP-notebook.md</code>), then reload.</div>';
}

async function boot() {
  // Handle the magic-link redirect + existing session
  const { data: { session } } = await sb.auth.getSession();
  if (session) return showApp(session);
  sb.auth.onAuthStateChange((_e, s) => { if (s) showApp(s); });

  document.getElementById("loginBtn").addEventListener("click", sendLink);
  document.getElementById("email").addEventListener("keydown", e => { if (e.key === "Enter") sendLink(); });
}

async function sendLink() {
  const email = document.getElementById("email").value.trim();
  const msg = document.getElementById("gateMsg");
  if (!email) { msg.className = "msg err"; msg.textContent = "Enter your email."; return; }
  msg.className = "msg muted"; msg.textContent = "Sending…";
  const { error } = await sb.auth.signInWithOtp({
    email, options: { emailRedirectTo: window.location.href.split("#")[0] }
  });
  if (error) { msg.className = "msg err"; msg.textContent = error.message; }
  else { msg.className = "msg ok"; msg.textContent = "Check your email for the sign-in link."; }
}

function showApp(session) {
  gate.style.display = "none";
  app.style.display = "block";
  document.getElementById("whoEmail").textContent = session.user.email;
  document.getElementById("logoutBtn").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  document.querySelectorAll(".tabs button").forEach(b =>
    b.addEventListener("click", () => { currentTab = b.dataset.tab; setActiveTab(); renderTab(); }));
  setActiveTab(); renderTab();
}
function setActiveTab() {
  document.querySelectorAll(".tabs button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === currentTab));
}

/* ---------- helpers ---------- */
const view = () => document.getElementById("view");
function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s) { return (s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
async function q(table) { return sb.from(table); }
function today() { return new Date().toISOString().slice(0,10); }

async function renderTab() {
  view().innerHTML = '<div class="empty">Loading…</div>';
  if (currentTab === "people") return renderPeople();
  if (currentTab === "projects") return renderProjects();
  if (currentTab === "meetings") return renderMeetings();
  if (currentTab === "calendar") return renderCalendar();
  if (currentTab === "tasks") return renderTasks();
  if (currentTab === "recipes") return renderRecipes();
}

/* ========================= PEOPLE ========================= */
async function renderPeople() {
  const { data: people, error } = await sb.from("people").select("*").eq("active", true).order("name");
  if (error) return showErr(error);
  const v = view(); v.innerHTML = "";
  (people || []).forEach(p => {
    const c = el(`<div class="card2 clickable">
      <h3>${esc(p.name)}</h3>
      <div class="sub">${esc(p.role || "")}${p.relationship ? " · " + esc(p.relationship) : ""}</div>
    </div>`);
    c.addEventListener("click", () => renderPersonFile(p));
    v.appendChild(c);
  });
  if (!people || !people.length) v.appendChild(el('<div class="empty">No people yet.</div>'));

  const add = el(`<div class="add-box"><div class="add-grid">
    <label class="fld full">Name<input id="pName" type="text" placeholder="Full name"></label>
    <label class="fld">Role<input id="pRole" type="text" placeholder="Runner"></label>
    <label class="fld">Relationship<input id="pRel" type="text" placeholder="Direct report"></label>
    <div class="full"><button id="pAdd">Add person</button></div>
  </div></div>`);
  v.appendChild(add);
  document.getElementById("pAdd").addEventListener("click", async () => {
    const name = document.getElementById("pName").value.trim();
    if (!name) return;
    const slug = name.toLowerCase().split(/\s+/)[0].replace(/[^a-z0-9]/g, "");
    const { error } = await sb.from("people").insert({
      slug, name, role: document.getElementById("pRole").value.trim() || null,
      relationship: document.getElementById("pRel").value.trim() || null });
    if (error) return alert(error.message);
    renderPeople();
  });
}

async function renderPersonFile(p) {
  const { data: notes, error } = await sb.from("person_notes")
    .select("*").eq("person_id", p.id).order("note_date", { ascending: false });
  if (error) return showErr(error);
  const v = view(); v.innerHTML = "";
  const back = el('<a class="back" href="#">← All people</a>');
  back.addEventListener("click", e => { e.preventDefault(); renderPeople(); });
  v.appendChild(back);
  /* ---- Profile: reads as plain text, swaps to live fields on Edit (or a tap
     on the name), the same way a task heading opens its card. ---- */
  const profile = el('<div class="card2"></div>');
  v.appendChild(profile);

  function profileRead() {
    profile.innerHTML = "";
    const sub = [p.role, p.relationship, p.org].filter(Boolean).map(esc).join(" · ");
    profile.appendChild(el(`<div class="row">
      <h3 class="edit-head" style="margin:0;flex:1">${esc(p.name)}</h3>
      <button class="ghost" id="pEdit">Edit</button>
    </div>`));
    if (sub) profile.appendChild(el(`<div class="sub">${sub}</div>`));
    if (p.context) profile.appendChild(el(`<p style="font-size:13.5px;margin:10px 0 0">${esc(p.context)}</p>`));
    profile.querySelector("#pEdit").addEventListener("click", profileEdit);
    profile.querySelector(".edit-head").addEventListener("click", profileEdit);
  }

  function profileEdit() {
    profile.innerHTML = "";
    profile.appendChild(el(`<div class="edit-grid">
      <label class="fld full">Name<input id="peName" type="text" value="${esc(p.name)}"></label>
      <label class="fld">Role<input id="peRole" type="text" value="${esc(p.role || "")}" placeholder="Runner"></label>
      <label class="fld">Relationship<input id="peRel" type="text" value="${esc(p.relationship || "")}" placeholder="Direct report"></label>
      <label class="fld full">Org<input id="peOrg" type="text" value="${esc(p.org || "")}" placeholder="Dexter Builders"></label>
      <label class="fld full">Background<textarea id="peCtx" style="min-height:110px"
        placeholder="Who they are and history — anything dated belongs in a note instead">${esc(p.context || "")}</textarea></label>
      <div class="full row">
        <button id="peSave">Save</button>
        <button id="peCancel" class="secondary">Cancel</button>
      </div>
    </div>`));
    profile.querySelector("#peCancel").addEventListener("click", profileRead);
    profile.querySelector("#peSave").addEventListener("click", async () => {
      const name = document.getElementById("peName").value.trim();
      if (!name) return;
      const patch = {
        name,
        role: document.getElementById("peRole").value.trim() || null,
        relationship: document.getElementById("peRel").value.trim() || null,
        org: document.getElementById("peOrg").value.trim() || null,
        context: document.getElementById("peCtx").value.trim() || null,
      };
      const { error } = await sb.from("people").update(patch).eq("id", p.id);
      if (error) return alert(error.message);
      Object.assign(p, patch);   // keep the local copy in step with the row we just wrote
      profileRead();
    });
  }
  profileRead();

  /* ---- Notes: each one can be edited or deleted in place ---- */
  const list = el('<div></div>');
  v.appendChild(list);

  function drawNotes() {
    // Re-sort in case an edit moved a note's date.
    (notes || []).sort((a, b) => a.note_date < b.note_date ? 1 : a.note_date > b.note_date ? -1 : 0);
    list.innerHTML = "";
    (notes || []).forEach(n => list.appendChild(noteEl(n)));
    if (!notes || !notes.length) list.appendChild(el('<div class="empty">No notes yet.</div>'));
  }

  function noteEl(n) {
    const wrap = el('<div class="note"></div>');
    function read() {
      wrap.innerHTML = "";
      wrap.appendChild(el(`<div class="head">
        <span class="badge type-${esc(n.type)}">${esc(n.type)}</span>
        <span>${esc(n.note_date)}</span>
        <span style="flex:1"></span>
        <button class="ghost note-edit">Edit</button>
      </div>`));
      wrap.appendChild(el(`<div>${esc(n.body)}</div>`));
      wrap.querySelector(".note-edit").addEventListener("click", edit);
    }
    function edit() {
      wrap.innerHTML = "";
      wrap.appendChild(el(`<div class="edit-grid">
        <label class="fld">Type<select class="neType">${
          ["1:1", "note", "goal", "expectation", "observation"].map(t =>
            `<option value="${t}"${t === n.type ? " selected" : ""}>${t}</option>`).join("")
        }</select></label>
        <label class="fld">Date<input class="neDate" type="date" value="${esc(n.note_date)}"></label>
        <label class="fld full">Note<textarea class="neBody" style="min-height:90px">${esc(n.body)}</textarea></label>
        <div class="full row">
          <button class="neSave">Save</button>
          <button class="neCancel secondary">Cancel</button>
          <div class="spacer"></div>
          <button class="neDel ghost" title="Delete">✕</button>
        </div>
      </div>`));
      wrap.querySelector(".neCancel").addEventListener("click", read);
      wrap.querySelector(".neSave").addEventListener("click", async () => {
        const body = wrap.querySelector(".neBody").value.trim();
        if (!body) return;
        const patch = { body, type: wrap.querySelector(".neType").value,
          note_date: wrap.querySelector(".neDate").value || n.note_date };
        const { error } = await sb.from("person_notes").update(patch).eq("id", n.id);
        if (error) return alert(error.message);
        Object.assign(n, patch);
        drawNotes();   // redraw the whole log in case the date changed its place
      });
      wrap.querySelector(".neDel").addEventListener("click", async () => {
        if (!confirm("Delete this note?")) return;
        const { error } = await sb.from("person_notes").delete().eq("id", n.id);
        if (error) return alert(error.message);
        const i = notes.indexOf(n); if (i > -1) notes.splice(i, 1);
        drawNotes();
      });
    }
    read();
    return wrap;
  }
  drawNotes();

  const add = el(`<div class="add-box"><div class="add-grid">
    <label class="fld">Type<select id="nType">
      <option value="1:1">1:1</option><option value="note">note</option>
      <option value="goal">goal</option><option value="expectation">expectation</option>
      <option value="observation">observation</option></select></label>
    <label class="fld">Date<input id="nDate" type="date" value="${today()}"></label>
    <label class="fld full">Note<textarea id="nBody" placeholder="What happened / what was decided…"></textarea></label>
    <div class="full"><button id="nAdd">Add note</button></div>
  </div></div>`);
  v.appendChild(add);
  document.getElementById("nAdd").addEventListener("click", async () => {
    const body = document.getElementById("nBody").value.trim();
    if (!body) return;
    const { error } = await sb.from("person_notes").insert({
      person_id: p.id, type: document.getElementById("nType").value,
      note_date: document.getElementById("nDate").value || today(), body });
    if (error) return alert(error.message);
    renderPersonFile(p);
  });
}

/* ========================= PROJECTS ========================= */
async function renderProjects() {
  const { data: projects, error } = await sb.from("projects").select("*").eq("active", true).order("name");
  if (error) return showErr(error);
  const v = view(); v.innerHTML = "";
  (projects || []).forEach(p => {
    const c = el(`<div class="card2 clickable">
      <h3>${esc(p.name)}</h3>
      <div class="sub">${esc(p.status || "")}${p.context ? (p.status ? " · " : "") + esc(p.context) : ""}</div>
    </div>`);
    c.addEventListener("click", () => renderProjectFile(p));
    v.appendChild(c);
  });
  if (!projects || !projects.length) v.appendChild(el('<div class="empty">No projects yet.</div>'));

  const add = el(`<div class="add-box"><div class="add-grid">
    <label class="fld full">Project<input id="prjName" type="text" placeholder="Project name"></label>
    <label class="fld full">Status (optional)<input id="prjStatus" type="text" placeholder="active"></label>
    <div class="full"><button id="prjAdd">Add project</button></div>
  </div></div>`);
  v.appendChild(add);
  document.getElementById("prjAdd").addEventListener("click", async () => {
    const name = document.getElementById("prjName").value.trim();
    if (!name) return;
    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    const { error } = await sb.from("projects").insert({
      slug, name, status: document.getElementById("prjStatus").value.trim() || null });
    if (error) return alert(error.message);
    renderProjects();
  });
}

async function renderProjectFile(p) {
  const { data: notes, error } = await sb.from("project_notes")
    .select("*").eq("project_id", p.id)
    .order("note_date", { ascending: false }).order("created_at", { ascending: false });
  if (error) return showErr(error);
  const v = view(); v.innerHTML = "";
  const back = el('<a class="back" href="#">← All projects</a>');
  back.addEventListener("click", e => { e.preventDefault(); renderProjects(); });
  v.appendChild(back);
  v.appendChild(el(`<div class="card2"><h3>${esc(p.name)}</h3>
    <div class="sub">${esc(p.status || "")}</div>
    ${p.context ? `<p style="font-size:13.5px;margin:10px 0 0">${esc(p.context)}</p>` : ""}</div>`));

  // Quick add box up top so jotting an entry is one tap; the log reads newest-first below.
  const add = el(`<div class="add-box"><div class="add-grid">
    <label class="fld">Date<input id="prjnDate" type="date" value="${today()}"></label>
    <div></div>
    <label class="fld full">Note<textarea id="prjnBody" placeholder="What happened / where things stand…"></textarea></label>
    <div class="full"><button id="prjnAdd">Add note</button></div>
  </div></div>`);
  v.appendChild(add);
  document.getElementById("prjnAdd").addEventListener("click", async () => {
    const body = document.getElementById("prjnBody").value.trim();
    if (!body) return;
    const { error } = await sb.from("project_notes").insert({
      project_id: p.id, note_date: document.getElementById("prjnDate").value || today(), body });
    if (error) return alert(error.message);
    renderProjectFile(p);
  });

  const list = el('<div></div>');
  (notes || []).forEach(n => list.appendChild(el(`<div class="note">
    <div class="head"><span>${esc(n.note_date)}</span></div>
    <div>${esc(n.body)}</div></div>`)));
  if (!notes || !notes.length) list.appendChild(el('<div class="empty">No notes yet.</div>'));
  v.appendChild(list);
}

/* ========================= MEETINGS ========================= */

async function renderMeetings() {
  const { data: meetings, error } = await sb.from("meetings").select("*").eq("active", true).order("name");
  if (error) return showErr(error);
  const v = view(); v.innerHTML = "";

  // Meeting definitions — click one to add/view its own entries
  v.appendChild(el(`<div style="${groupH}">Meetings — tap to add a note</div>`));
  (meetings || []).forEach(m => {
    const c = el(`<div class="card2 clickable"><h3>${esc(m.name)}</h3>
      <div class="sub">${esc(m.cadence || "")}${m.day_of_week ? " · " + esc(m.day_of_week) : ""}${m.participants ? " · " + esc(m.participants) : ""}</div></div>`);
    c.addEventListener("click", () => renderMeeting(m));
    v.appendChild(c);

  if (!meetings || !meetings.length) v.appendChild(el('<div class="empty">No meetings defined.</div>'));

  // Chronological feed of ALL entries across meetings (most recent first)
  const { data: entries, error: e2 } = await sb.from("meeting_entries")
    .select("*, meetings(name)")
    .order("entry_date", { ascending: false }).order("created_at", { ascending: false });
  if (e2) return showErr(e2);
  v.appendChild(el(`<div style="${groupH}">All notes — newest first</div>`));
  (entries || []).forEach(en => v.appendChild(el(`<div class="card2">
    <div class="sub" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span class="badge" style="color:var(--accent)">${esc(en.meetings ? en.meetings.name : "")}</span>
      <span>${esc(en.entry_date)}</span>
    </div>
    ${en.note ? `<p style="margin:8px 0 0">${esc(en.note)}</p>` : ""}
  </div>`)));
  if (!entries || !entries.length) v.appendChild(el('<div class="empty">No meeting notes yet — tap a meeting above to add one.</div>'));
}

async function renderMeeting(m) {
  const { data: entries, error } = await sb.from("meeting_entries")
    .select("*").eq("meeting_id", m.id)
    .order("entry_date", { ascending: false }).order("created_at", { ascending: false });
  if (error) return showErr(error);
  const v = view(); v.innerHTML = "";
  const back = el('<a class="back" href="#">← All meetings</a>');
  back.addEventListener("click", e => { e.preventDefault(); renderMeetings(); });
  v.appendChild(back);
  v.appendChild(el(`<div class="card2"><h3>${esc(m.name)}</h3>
    <div class="sub">${esc(m.cadence || "")}${m.day_of_week ? " · " + esc(m.day_of_week) : ""}${m.participants ? " · " + esc(m.participants) : ""}</div>

/* ========================= CALENDAR ========================= */
// Local-midnight date from a yyyy-mm-dd string, and for "today".
function calParseISO(d){ const [y,m,day] = d.split("-").map(Number); return new Date(y, m-1, day); }
function calTodayDt(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function calNextYearly(mon, day, todayDt){
  let dt = new Date(todayDt.getFullYear(), mon-1, day);
  if (dt < todayDt) dt = new Date(todayDt.getFullYear()+1, mon-1, day);
  return dt;
}
// Date the item next lands on (>= today for recurring). null if it can't be dated.
function calEffectiveDate(it, todayDt){
  const dows = { sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6 };
  const r = (it.recur || "").trim().toLowerCase();
  if (!r) return it.item_date ? calParseISO(it.item_date) : null;
  let m;
  if ((m = r.match(/^weekly:(\w{3})/))) {
    const target = dows[m[1]];
    if (target == null) return null;
    const dt = new Date(todayDt);
    dt.setDate(dt.getDate() + ((target - dt.getDay() + 7) % 7));
    return dt;
  }
  if ((m = r.match(/^yearly:(\d{1,2})-(\d{1,2})$/))) return calNextYearly(+m[1], +m[2], todayDt);
  if (r === "yearly" && it.item_date) { const b = calParseISO(it.item_date); return calNextYearly(b.getMonth()+1, b.getDate(), todayDt); }
  if ((m = r.match(/^monthly:(\d{1,2})$/))) {
    const day = +m[1];
    const dt = new Date(todayDt.getFullYear(), todayDt.getMonth(), day);
    if (dt < todayDt) dt.setMonth(dt.getMonth()+1);
    return dt;
  }
  return null;
}
function calFmt(dt, todayDt){
  return dt.toLocaleDateString(undefined, {
    weekday:"short", month:"short", day:"numeric",
    year: dt.getFullYear() !== todayDt.getFullYear() ? "numeric" : undefined
  });
}

async function renderCalendar() {
  const { data: items, error } = await sb.from("calendar_items").select("*").eq("active", true);
  if (error) return showErr(error);
  const v = view(); v.innerHTML = "";
  const todayDt = calTodayDt();

  // Resolve each item to its next/effective date; split datable from undated; sort chronologically.
  const withDate = [], undated = [];
  (items || []).forEach(it => {
    const eff = calEffectiveDate(it, todayDt);
    if (eff) withDate.push({ it, eff }); else undated.push(it);
  });
  withDate.sort((a, b) => a.eff - b.eff);

  const card = (it, eff) => el(`<div class="card2">
    <h3>${esc(it.title)}</h3>
    <div class="sub">${eff ? esc(calFmt(eff, todayDt)) : "no date"}${it.recur ? ` · ↻ ${esc(it.recur)}` : ""}${it.category ? " · " + esc(it.category) : ""}${it.who ? " · " + esc(it.who) : ""}</div>
    ${it.notes ? `<p style="font-size:13px;margin:8px 0 0">${esc(it.notes)}</p>` : ""}
  </div>`);

  // The current date sits at the very top so the page loads on today; upcoming
  // items follow, and past dates are tucked into a collapsible below.
  const upcoming = withDate.filter(x => x.eff >= todayDt);
  const past = withDate.filter(x => x.eff < todayDt).reverse(); // most-recent first

  v.appendChild(el(`<div style="display:flex;align-items:center;gap:10px;margin:0 0 8px;color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.05em">
    <span style="height:1px;flex:1;background:var(--accent);opacity:.5"></span>Today · ${esc(calFmt(todayDt, todayDt))}<span style="height:1px;flex:1;background:var(--accent);opacity:.5"></span></div>`));
  upcoming.forEach(({ it, eff }) => v.appendChild(card(it, eff)));
  if (!upcoming.length) v.appendChild(el('<div class="empty">Nothing upcoming.</div>'));

  if (past.length) {
    const details = document.createElement("details");
    details.style.marginTop = "18px";
    details.appendChild(el(`<summary style="cursor:pointer;color:var(--muted);font-size:13px;font-weight:600">Earlier (${past.length})</summary>`));
    const pWrap = el('<div style="margin-top:10px"></div>');
    past.forEach(({ it, eff }) => pWrap.appendChild(card(it, eff)));
    details.appendChild(pWrap);
    v.appendChild(details);
  }

  if (undated.length) {
    v.appendChild(el(`<div style="${groupH}">No date</div>`));
    undated.forEach(it => v.appendChild(card(it, null)));
  }
  if (!withDate.length && !undated.length) v.appendChild(el('<div class="empty">No calendar items yet.</div>'));

  const add = el(`<div class="add-box"><div class="add-grid">
    <label class="fld full">Title<input id="cTitle" type="text" placeholder="Daughter's swim"></label>
    <label class="fld">Category<select id="cCat">
      <option value="reminder">reminder</option><option value="birthday">birthday</option>
      <option value="kids">kids</option><option value="family">family</option>
      <option value="appointment">appointment</option></select></label>
    <label class="fld">Who<input id="cWho" type="text" placeholder="daughter"></label>
    <label class="fld">One-off date<input id="cDate" type="date"></label>
    <label class="fld">Recur<input id="cRecur" type="text" placeholder="weekly:wed / yearly:03-14"></label>
    <div class="full"><button id="cAdd">Add item</button></div>
  </div></div>`);
  v.appendChild(add);
  document.getElementById("cAdd").addEventListener("click", async () => {
    const title = document.getElementById("cTitle").value.trim();
    if (!title) return;
    const { error } = await sb.from("calendar_items").insert({
      title, category: document.getElementById("cCat").value,
      who: document.getElementById("cWho").value.trim() || null,
      item_date: document.getElementById("cDate").value || null,
      recur: document.getElementById("cRecur").value.trim() || null });
    if (error) return alert(error.message);
    renderCalendar();
  });

  // Load at the top so the current date is the first thing shown.
  window.scrollTo(0, 0);
}

/* ========================= TASKS ========================= */
async function renderTasks() {
  const { data: tasks, error } = await sb.from("tasks")
    .select("*").order("done").order("due", { nullsFirst: false }).order("created", { nullsFirst: false });
  if (error) return showErr(error);
  const open = (tasks || []).filter(t => !t.done);
  const done = (tasks || []).filter(t => t.done);
  const v = view(); v.innerHTML = "";

  // Add form
  const add = el(`<div class="add-box"><div class="add-grid">
    <label class="fld full">New task<input id="tTitle" type="text" placeholder="What needs doing…"></label>
    <label class="fld">Job (optional)<input id="tJob" type="text" placeholder="Client / Personal"></label>
    <label class="fld">Due (optional)<input id="tDue" type="date"></label>
    <div class="full"><button id="tAdd">Add task</button></div>
  </div></div>`);
  v.appendChild(add);
  const addTask = async () => {
    const title = document.getElementById("tTitle").value.trim();
    if (!title) return;
    const { error } = await sb.from("tasks").insert({
      title, job: document.getElementById("tJob").value.trim() || null,
      due: document.getElementById("tDue").value || null, created: today() });
    if (error) return alert(error.message);
    renderTasks();
  };
  document.getElementById("tAdd").addEventListener("click", addTask);
  document.getElementById("tTitle").addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

  v.appendChild(el(`<div class="group-h" style="color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px">Open (${open.length})</div>`));
  const openWrap = el('<div></div>');
  open.forEach(t => openWrap.appendChild(taskRow(t)));
  if (!open.length) openWrap.appendChild(el('<div class="empty">🎉 Nothing open.</div>'));
  v.appendChild(openWrap);

  if (done.length) {
    const details = document.createElement("details");
    details.style.marginTop = "18px";
    details.appendChild(el(`<summary style="cursor:pointer;color:var(--muted);font-size:13px;font-weight:600">Done (${done.length})</summary>`));
    const dWrap = el('<div style="margin-top:10px"></div>');
    done.forEach(t => dWrap.appendChild(taskRow(t)));
    details.appendChild(dWrap);
    v.appendChild(details);
  }
}

/* One task's own card — the heading in the list opens this. Everything is a
   live field, so there's no separate "edit" mode to enter. */
async function renderTask(t) {
  const v = view(); v.innerHTML = "";
  const back = el('<a class="back" href="#">← All tasks</a>');
  back.addEventListener("click", e => { e.preventDefault(); renderTasks(); });
  v.appendChild(back);

  const card = el(`<div class="card2"><div class="edit-grid">
    <label class="fld full">Task<input id="teTitle" type="text" value="${esc(t.title)}"></label>
    <label class="fld full">Description<textarea id="teDesc" style="min-height:120px"
      placeholder="The longer version — context, links, what done looks like…">${esc(t.description || "")}</textarea></label>
    <label class="fld">Job<input id="teJob" type="text" value="${esc(t.job || "")}" placeholder="Client / Personal"></label>
    <label class="fld">Due<input id="teDue" type="date" value="${esc(t.due || "")}"></label>
    <label class="fld">Repeats<input id="teRecur" type="text" value="${esc(t.recur || "")}" placeholder="biweekly"></label>
    <div></div>
    <div class="full row">
      <button id="teSave">Save</button>
      <button id="teDone" class="secondary">${t.done ? "Reopen" : "Mark done"}</button>
      <div class="spacer"></div>
      <span class="msg muted" id="teMsg"></span>
      <button id="teDel" class="ghost" title="Delete">✕</button>
    </div>
  </div></div>`);
  v.appendChild(card);

  const meta = [];
  if (t.created) meta.push("added " + t.created);
  if (t.done && t.completed) meta.push("done " + t.completed);
  if (meta.length) v.appendChild(el(`<div class="sub" style="margin-top:10px">${esc(meta.join(" · "))}</div>`));

  const save = async () => {
    const title = document.getElementById("teTitle").value.trim();
    if (!title) return;
    const patch = {
      title,
      description: document.getElementById("teDesc").value.trim() || null,
      job: document.getElementById("teJob").value.trim() || null,
      due: document.getElementById("teDue").value || null,
      recur: document.getElementById("teRecur").value.trim() || null,
    };
    const { error } = await sb.from("tasks").update(patch).eq("id", t.id);
    if (error) return alert(error.message);
    Object.assign(t, patch);   // keep the local copy in step with the row we just wrote
    const msg = document.getElementById("teMsg");
    msg.className = "msg ok"; msg.textContent = "Saved";
    setTimeout(() => { msg.textContent = ""; }, 1500);
  };
  document.getElementById("teSave").addEventListener("click", save);
  // Enter in a single-line field saves; in the description use Cmd/Ctrl+Enter.
  card.querySelectorAll('input').forEach(i =>
    i.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); save(); } }));
  document.getElementById("teDesc").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); } });

  document.getElementById("teDone").addEventListener("click", async () => {
    const { error } = await sb.from("tasks").update({
      done: !t.done, completed: !t.done ? today() : null }).eq("id", t.id);
    if (error) return alert(error.message);
    renderTasks();
  });
  document.getElementById("teDel").addEventListener("click", async () => {
    if (!confirm("Delete this task?")) return;
    const { error } = await sb.from("tasks").delete().eq("id", t.id);
    if (error) return alert(error.message);
    renderTasks();
  });
}

function taskRow(t) {
  const row = el(`<div class="card2" style="display:flex;align-items:flex-start;gap:10px;${t.done ? "opacity:.6" : ""}"></div>`);
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.checked = t.done; cb.style.cssText = "margin-top:3px;width:18px;height:18px;accent-color:var(--green);cursor:pointer";
  cb.addEventListener("change", async () => {
    const { error } = await sb.from("tasks").update({
      done: cb.checked, completed: cb.checked ? today() : null }).eq("id", t.id);
    if (error) { alert(error.message); return; }
    renderTasks();
  });
  const body = el(`<div style="flex:1;min-width:0">
    <div class="task-title" style="${t.done ? "text-decoration:line-through" : ""}">${esc(t.title)}</div>
    ${t.description ? `<div class="task-preview">${esc(t.description)}</div>` : ""}
    <div class="sub" style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap">
      ${t.job ? `<span class="badge">${esc(t.job)}</span>` : ""}
      ${t.due ? `<span class="badge" style="color:var(--accent)">due ${esc(t.due)}</span>` : ""}
      ${t.recur ? `<span class="badge" style="color:var(--green)">↻ ${esc(t.recur)}</span>` : ""}
      ${t.done && t.completed ? `<span class="badge">done ${esc(t.completed)}</span>` : ""}
    </div>
  </div>`);
  // Tapping the heading opens the task's own card, where everything is editable.
  body.querySelector(".task-title").addEventListener("click", () => renderTask(t));
  const del = el('<button class="ghost" title="Delete" style="font-size:16px">✕</button>');
  del.addEventListener("click", async () => {
    if (!confirm("Delete this task?")) return;
    const { error } = await sb.from("tasks").delete().eq("id", t.id);
    if (error) return alert(error.message);
    renderTasks();
  });
  row.append(cb, body, del);
  return row;
}

/* ========================= RECIPES ========================= */
async function renderRecipes() {
  // Ingredients come along so the search box can match on them too ("what uses cilantro?").
  const { data: recipes, error } = await sb.from("recipes")
    .select("*, recipe_ingredients(item)").eq("active", true).order("title");
  if (error) return showErr(error);
  const v = view(); v.innerHTML = "";

  const search = el('<input class="search" type="text" placeholder="Search title or ingredient — e.g. cilantro">');
  const list = el('<div></div>');
  v.append(search, list);

  // Filter in place rather than re-rendering, so the caret stays put while typing.
  function draw() {
    const term = search.value.trim().toLowerCase();
    list.innerHTML = "";
    const matches = (recipes || []).filter(r =>
      !term || r.title.toLowerCase().includes(term)
            || (r.recipe_ingredients || []).some(i => i.item.toLowerCase().includes(term)));
    matches.forEach(r => {
      const bits = [];
      if (r.servings) bits.push(r.servings + " servings");
      if (r.description) bits.push(r.description);
      const c = el(`<div class="card2 clickable">
        <h3>${esc(r.title)}</h3>
        <div class="sub">${esc(bits.join(" · "))}</div>
      </div>`);
      c.addEventListener("click", () => renderRecipe(r));
      list.appendChild(c);
    });
    if (!matches.length) list.appendChild(el(
      `<div class="empty">${term ? "No recipes match that." : "No recipes yet."}</div>`));
  }
  search.addEventListener("input", draw);
  draw();

  const add = el(`<div class="add-box"><div class="add-grid">
    <label class="fld full">Recipe<input id="rcpTitle" type="text" placeholder="Recipe name"></label>
    <label class="fld">Servings<input id="rcpServ" type="text" placeholder="4"></label>
    <label class="fld">Description<input id="rcpDesc" type="text" placeholder="One line"></label>
    <div class="full"><button id="rcpAdd">Add recipe</button></div>
  </div></div>`);
  v.appendChild(add);
  document.getElementById("rcpAdd").addEventListener("click", async () => {
    const title = document.getElementById("rcpTitle").value.trim();
    if (!title) return;
    const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    const serv = parseInt(document.getElementById("rcpServ").value.trim(), 10);
    const { error } = await sb.from("recipes").insert({
      slug, title, servings: isNaN(serv) ? null : serv,
      description: document.getElementById("rcpDesc").value.trim() || null,
      source: "personal" });
    if (error) return alert(error.message);
    renderRecipes();
  });
}

async function renderRecipe(r) {
  const { data: ings, error } = await sb.from("recipe_ingredients")
    .select("*").eq("recipe_id", r.id).order("sort").order("created_at");
  if (error) return showErr(error);
  const v = view(); v.innerHTML = "";
  const back = el('<a class="back" href="#">← All recipes</a>');
  back.addEventListener("click", e => { e.preventDefault(); renderRecipes(); });
  v.appendChild(back);

  const steps = r.instructions || [];
  const meta = [];
  if (r.servings) meta.push(esc(r.servings + " servings"));
  if (r.source === "ai") meta.push('<span class="badge">AI generated</span>');
  v.appendChild(el(`<div class="card2">
    <h3>${esc(r.title)}</h3>
    <div class="sub">${meta.join(" · ")}</div>
    ${r.description ? `<p style="font-size:13.5px;margin:10px 0 0">${esc(r.description)}</p>` : ""}
    ${r.notes ? `<p style="font-size:12.5px;color:var(--amber);margin:8px 0 0">${esc(r.notes)}</p>` : ""}
  </div>`));

  const stepCard = el('<div class="card2"><h3>Instructions</h3></div>');
  if (steps.length) steps.forEach((s, i) => stepCard.appendChild(el(
    `<div class="step"><div class="n">${i + 1}</div><div>${esc(s)}</div></div>`)));
  else stepCard.appendChild(el('<div class="empty">No instructions yet.</div>'));
  v.appendChild(stepCard);

  const ingCard = el('<div class="card2"><h3>Ingredients</h3></div>');
  (ings || []).forEach(i => ingCard.appendChild(el(
    `<div class="ing"><span>${esc(i.item)}${i.inferred
        ? '<span class="flag" title="Guessed from the instructions, not in the original — check before trusting it">inferred</span>'
        : ""}</span><span class="qty">${esc(i.qty || "")}</span></div>`)));
  if (!ings || !ings.length) ingCard.appendChild(el('<div class="empty">No ingredients yet.</div>'));
  v.appendChild(ingCard);

  const add = el(`<div class="add-box"><div class="add-grid">
    <label class="fld">Ingredient<input id="ingItem" type="text" placeholder="ground turkey"></label>
    <label class="fld">Amount<input id="ingQty" type="text" placeholder="1 lb"></label>
    <div class="full"><button id="ingAdd">Add ingredient</button></div>
    <label class="fld full">Step<textarea id="stepBody" placeholder="Next instruction step…"></textarea></label>
    <div class="full"><button id="stepAdd" class="secondary">Add step</button></div>
  </div></div>`);
  v.appendChild(add);

  document.getElementById("ingAdd").addEventListener("click", async () => {
    const item = document.getElementById("ingItem").value.trim();
    if (!item) return;
    const nextSort = (ings || []).reduce((m, i) => Math.max(m, i.sort || 0), 0) + 1;
    const { error } = await sb.from("recipe_ingredients").insert({
      recipe_id: r.id, item,
      qty: document.getElementById("ingQty").value.trim() || null, sort: nextSort });
    if (error) return alert(error.message);
    renderRecipe(r);
  });
  document.getElementById("stepAdd").addEventListener("click", async () => {
    const body = document.getElementById("stepBody").value.trim();
    if (!body) return;
    const next = steps.concat([body]);
    const { error } = await sb.from("recipes").update({ instructions: next }).eq("id", r.id);
    if (error) return alert(error.message);
    r.instructions = next;   // keep the in-memory copy in step with the row we just wrote
    renderRecipe(r);
  });
}

function showErr(error) {
  view().innerHTML = `<div class="setup">Couldn't load data: ${esc(error.message)}<br><br>
    If this says permission denied, make sure you ran <code>supabase/schema.sql</code> and are signed in.</div>`;
}
